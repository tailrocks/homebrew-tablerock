schema = 2

[generator]
repository = "tailrocks/homebrew-tablerock"
revision = "be61acbbbfb71db6b51337e547e39de049d4fc15"

# Public tap: GitHub-hosted singleton (no velnor lanes).
[workflow]
providers = ["github-hosted"]
automatic_providers = ["github-hosted"]
default_branch = "main"

[workflow.selectors.github-hosted]
runs_on = ["ubuntu-24.04"]

# Trio per as-code/runbook; live protect-main is still [ci-required, DCO],
# so Policy reports advisory-red until the W6.2 terraform apply adds live
# Policy — no tree change needed then (the declaration already matches).
[policy]
ruleset_required_status_checks = ["ci-required", "Policy"]
ruleset_external_status_checks = ["DCO"]

[[units]]
id = "tap-local"
kind = "homebrew"
label = "Tap local checkout"
ci_tasks = ["brew:tap-local"]

[[units.products]]
name = "local-tap"
task = "brew:tap-local"

# NOTE (s1 -> s2 fidelity delta): the s1 row carried
# `capabilities = ["xcode"]`, which rendered a second `verify-github-apple`
# leg on macos-15 running the same homebrew checks. Schema 2 has no `capabilities`
# key (deny_unknown_fields) and its model (one platform per unit, one collapsed
# job per kind per provider) cannot express same-kind dual-platform legs, so
# the s2 tree verifies on linux-x64 only. The tap's Casks/ still get
# `brew audit --strict --online` on Linux; restoring macOS coverage needs a
# generator increment (multi-platform unit legs) or an evented macos
# check-profile + required-context change (owner decision, follow-up).
[[units]]
id = "homebrew"

[[units.prerequisites]]
producer = "tap-local"
product = "local-tap"
