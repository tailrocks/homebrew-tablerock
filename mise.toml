[tools]
actionlint = "1.7.12"
gh = "2.96.0"
jq = "1.8.2"
shellcheck = "0.11.0"

[tasks.actionlint]
run = "actionlint"

[tasks.package-update]
run = "./scripts/package-update.sh"

[tasks.package-update-test]
run = "./scripts/test-package-update.sh"

[tasks.check]
depends = ["actionlint", "package-update-test"]

[tasks.build]
depends = ["check"]

[tasks.test]
depends = ["package-update-test"]

[tasks.lint]
depends = ["actionlint"]

[tasks.fmt]
depends = ["check"]

[settings]
lockfile = true
